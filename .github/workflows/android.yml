# ===========================================================================
#  Build the Android APK.
#
#  Produces a debug + release APK per run and uploads them as artifacts.
#  On a version tag (v*), the APKs are attached to a GitHub Release.
# ===========================================================================
name: Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.9'
  NDK_VERSION: '26.3.11579264'
  CMAKE_VERSION: '3.24.0+'

jobs:
  # -------------------------------------------------------------------------
  # Validate shaders before spending 15 minutes on a full NDK build. A GLSL
  # error is by far the most common breakage, and this job takes ~40 seconds.
  # -------------------------------------------------------------------------
  shaders:
    name: Validate GLSL
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install glslang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools

      - name: Compile every shader to SPIR-V
        run: |
          set -euo pipefail
          fail=0
          out=$(mktemp -d)
          while IFS= read -r -d '' f; do
            echo "::group::$f"
            if ! glslangValidator --target-env vulkan1.2 -Os \
                   -Iengine/shaders -o "$out/$(basename "$f").spv" "$f"; then
              echo "::error file=$f::GLSL compilation failed"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find engine/shaders -type f \( -name '*.vert' -o -name '*.frag' \
                   -o -name '*.comp' -o -name '*.glsl' \) ! -path '*/common/*' -print0)
          exit $fail

  build:
    name: Build APK
    needs: shaders
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android NDK + CMake
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-35" > /dev/null

      - name: Install glslang (shaders -> SPIR-V at build time)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools ninja-build

      - name: Cache Gradle + CMake artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
          key: ${{ runner.os }}-android-${{ hashFiles('**/*.gradle.kts', '**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: ${{ runner.os }}-android-

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Report APK sizes
        run: |
          find android/app/build/outputs/apk -name '*.apk' -printf '%p %s\n' \
            | awk '{ printf "%-60s %6.1f MiB\n", $1, $2/1048576 }'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neoasis-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: neoasis-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload native symbols
        uses: actions/upload-artifact@v4
        with:
          name: neoasis-native-symbols
          path: |
            android/app/build/intermediates/cxx/**/*.so
            android/app/build/intermediates/merged_native_libs/**/*.so
          if-no-files-found: warn
          retention-days: 90

  # -------------------------------------------------------------------------
  # Attach the APKs to a GitHub Release when a v* tag is pushed.
  # -------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Neo-Asis Engine ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/neoasis-debug-apk/*.apk
            artifacts/neoasis-release-apk/*.apk
